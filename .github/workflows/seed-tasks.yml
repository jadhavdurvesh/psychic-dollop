name: Seed Tasks CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify required files exist
        run: |
          set -e
          echo "Checking for LICENSE..."
          test -f LICENSE || (echo "LICENSE file is missing!" && exit 1)
          echo "Checking for CODE_OF_CONDUCT.md..."
          test -f CODE_OF_CONDUCT.md || (echo "CODE_OF_CONDUCT.md file is missing!" && exit 1)
          echo "Checking README links..."
          grep -q "\[LICENSE\](LICENSE)" README.md || (echo "README missing LICENSE link!" && exit 1)
          grep -q "\[Code of Conduct\](CODE_OF_CONDUCT.md)" README.md || (echo "README missing Code of Conduct link!" && exit 1)
          echo "All required files are present."