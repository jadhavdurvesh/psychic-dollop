name: Seed Tasks CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify License and Code of Conduct files exist
        run: |
          if [ ! -f LICENSE ]; then
            echo "LICENSE file is missing."
            exit 1
          fi
          if [ ! -f CODE_OF_CONDUCT.md ]; then
            echo "CODE_OF_CONDUCT.md file is missing."
            exit 1
          fi

      - name: Run tests
        run: |
          pytest